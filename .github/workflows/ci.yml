name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The vectors are pinned to commits and hash-checked, so the
      # cache key only has to change when the script does.
      - uses: actions/cache@v6
        with:
          path: vectors
          key: acvp-${{ hashFiles('scripts/fetch-vectors.mjs') }}

      - name: Fetch test vectors (NIST ACVP, C2SP/CCTV)
        run: npm run vectors

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      # test:full adds the accumulated CCTV runs (10,000 rounds per parameter set).
      - name: Unit, vector and property tests
        run: npm run test:full

      - name: Build library and explainer
        run: npm run build

      # Ubuntu runners ship Google Chrome, which Playwright uses via channel: 'chrome'.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
